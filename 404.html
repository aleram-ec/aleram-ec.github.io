<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | EJ - Estudio Jurídico</title>
    <meta name="description" content="Página no encontrada — EJ - Estudio Jurídico.">
    <meta name="robots" content="no/, nofollow">
    <link rel="icon" type="image/svg+xml" href="img/inst/ANE.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --gold: #d4af37; --bg: #080e1a; --text: #f1f5f9; --muted: #94a3b8; }
        html { min-height: 100%; background: var(--bg); }
        body { min-height: 100vh; min-height: 100svh; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow-x: hidden; text-align: center; }

        /* Animated background */
        .bg-radial { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(212,175,55,0.09) 0%, transparent 58%), linear-gradient(180deg, #080e1a 0%, #0b1525 100%); z-/: 0; pointer-events: none; }
        .grid-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(212,175,55,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,0.025) 1px, transparent 1px); background-size: 64px 64px; z-/: 0; pointer-events: none; mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 80%, transparent); }

        /* Floating particles */
        .error-main { position: relative; z-/: 1; flex: 1; width: 100%; display: grid; place-items: center; padding: 112px 1.5rem 4rem; }
        .content { width: min(100%, 720px); padding: clamp(2rem, 6vw, 4.25rem); border: 1px solid rgba(212,175,55,0.2); border-radius: 28px; background: linear-gradient(145deg, rgba(18,29,48,0.92), rgba(10,18,32,0.88)); box-shadow: 0 28px 90px rgba(0,0,0,0.38), inset 0 1px rgba(255,255,255,0.04); }
        .error-label { display: inline-flex; align-items: center; gap: 0.55rem; color: #e5cb73; border: 1px solid rgba(212,175,55,0.25); background: rgba(212,175,55,0.07); border-radius: 99px; padding: 0.5rem 0.9rem; margin-bottom: 1rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
        .error-label i { display: inline-flex; }

        /* 404 Number */
        .num-404 { font-family: 'Cinzel', serif; font-size: clamp(6rem, 19vw, 10rem); font-weight: 700; line-height: 0.95; letter-spacing: -0.055em; background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 32%, #b38728 68%, #fbf5b7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 8px 28px rgba(212,175,55,0.16)); }

        /* Scale icon */
        .icon-wrap { display: none; }

        .err-title { font-family: 'Cinzel', serif; font-size: clamp(1.45rem, 3.5vw, 2.1rem); font-weight: 600; color: var(--text); margin: 0.45rem 0 0.85rem; }
        .err-desc { font-size: 0.96rem; color: var(--muted); line-height: 1.8; margin: 0 auto 2rem; max-width: 470px; }

        .btn-group { display: flex; gap: 0.85rem; justify-content: center; flex-wrap: wrap; }
        .btn-gold, .btn-outline { min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem; font-weight: 700; font-size: 0.88rem; padding: 0.8rem 1.35rem; border-radius: 50px; text-decoration: none; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        .btn-gold { background: linear-gradient(135deg, #bf953f, #d4af37, #aa771c); color: #080e1a; box-shadow: 0 6px 25px rgba(212,175,55,0.25); }
        .btn-gold:hover { box-shadow: 0 8px 30px rgba(212,175,55,0.42); transform: translateY(-2px); }
        .btn-outline { background: rgba(255,255,255,0.025); color: var(--text); border: 1px solid rgba(255,255,255,0.18); }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
        .btn-gold:focus-visible, .btn-outline:focus-visible, .quick-links a:focus-visible { outline: 2px solid #f0d060; outline-offset: 4px; }

        /* Quick links */
        .quick-links { margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .quick-links a { font-size: 0.8rem; color: var(--muted); text-decoration: none; transition: color 0.3s; display: flex; align-items: center; gap: 0.4rem; }
        .quick-links a:hover { color: var(--gold); }

        @media (max-width: 560px) {
            .error-main { padding: 96px 1rem 2.5rem; }
            .content { padding: 2.25rem 1.25rem; border-radius: 22px; }
            .num-404 { font-size: clamp(5.5rem, 27vw, 8rem); }
            .err-desc { font-size: 0.9rem; margin-bottom: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn-group a { width: 100%; }
            .quick-links { gap: 0.85rem 1.2rem; margin-top: 1.5rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body>
    <div class="bg-radial" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>

    <main class="error-main">
      <section class="content" aria-labelledby="error-title">
        <div class="error-label"><i data-lucide="scale" style="width:15px;height:15px;"></i> Error del sitio</div>
        <div class="num-404" aria-label="Error 404">404</div>
        <h1 class="err-title" id="error-title">Página no encontrada</h1>
        <p class="err-desc">
            El enlace puede estar desactualizado o la página ya no existe. Puedes volver al inicio o visitar nuestra tarjeta digital.
        </p>

        <div class="btn-group">
            <a href="/" class="btn-gold" id="btn-home">
                <i data-lucide="home" style="width:17px;height:17px;"></i>
                Ir al Inicio
            </a>
            <a href="tarjeta" class="btn-outline" id="btn-card-404">
                <i data-lucide="credit-card" style="width:17px;height:17px;"></i>
                Ver Tarjeta Digital
            </a>
        </div>

        <nav class="quick-links" aria-label="Accesos rápidos">
            <a href="/#servicios" id="link-services"><i data-lucide="shield-check" style="width:13px;height:13px;"></i> Servicios</a>
            <a href="/#contacto" id="link-contact"><i data-lucide="phone" style="width:13px;height:13px;"></i> Contacto</a>
            <a href="https://wa.me/593983201691" target="_blank" rel="noopener" id="link-wa"><i data-lucide="message-circle" style="width:13px;height:13px;"></i> WhatsApp</a>
        </nav>

      </section>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
